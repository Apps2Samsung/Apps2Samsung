<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add a source to Apps2Samsung</title>
    <meta
      name="description"
      content="Adds someone's own list of apps to Apps2Samsung, the Samsung TV app installer."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../favicon.ico" />
    <!-- Install links (#1066): this page only hands the link to the app. No other scripts, no storage, no requests. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="../install/link.css" />
    <script src="../install/link.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="../"><span class="mark" aria-hidden="true"></span>Apps2Samsung</a>
    </header>
    <main id="page" data-kind="source">
      <noscript><p>This page needs JavaScript to open Apps2Samsung. <a href="../#download">Download Apps2Samsung</a>.</p></noscript>
    </main>
  </body>
</html>
