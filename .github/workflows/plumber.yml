name: Plumber

on:
  push:
    branches:
      - beta
      - master
  pull_request:

permissions:
  contents: read

jobs:
  plumber:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Plumber reads the workflow runs and one run log to prove the
      # token scope of each job.
      actions: read
      security-events: write
      # Needed by score-push to publish the score for the README badge.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The action downloads its binary from Plumber's GitHub release and fails
      # outright when that download does (a 504 on #1034); soft-fail only covers
      # the score gate. So check first, and skip with a warning when it is not
      # reachable, or when the repository variable SKIP_PLUMBER is "true".
      - name: Check that Plumber can be downloaded
        id: available
        env:
          # Keep in step with the getplumber/plumber@ version below.
          PLUMBER_VERSION: v0.7.23
          SKIP_PLUMBER: ${{ vars.SKIP_PLUMBER }}
        run: |
          if [ "$SKIP_PLUMBER" = "true" ]; then
            echo "::warning::Plumber skipped: the repository variable SKIP_PLUMBER is true."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="https://github.com/getplumber/plumber/releases/download/${PLUMBER_VERSION}"
          for file in plumber-linux-amd64 checksums.txt; do
            if ! curl -fsSIL --retry 3 --retry-delay 10 --retry-all-errors -o /dev/null "${base}/${file}"; then
              echo "::warning::Plumber skipped: ${base}/${file} could not be downloaded. The analysis did not run."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: getplumber/plumber@v0.7.23
        if: steps.available.outputs.ok == 'true'
        with:
          # Code scanning upload needs security-events write, which PRs
          # from forks do not get. The report stays available as a
          # workflow artifact there.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Publishes the score to score.getplumber.io, which feeds the
          # badge in the README. A failed push never fails the run.
          score-push: true
          # Gate at 85 points instead of the all-or-nothing default,
          # leaves room for a small finding without blocking PRs.
          min-points: 85
