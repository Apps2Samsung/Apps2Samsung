name: Test IPA

# An unsigned iPhone build of any branch, as a downloadable artifact: the iOS counterpart of
# Test APK, and the first step of the SideStore channel (#753 step 6). SideStore re-signs an
# unsigned IPA on the phone with the user's own Apple ID, so no certificate or provisioning
# profile is involved here; the archive is just the app bundle for a real device (ios-arm64),
# which is why code signing is turned off explicitly (the project's entitlements would otherwise
# make the build look for a signing identity the runner doesn't have).
#
# iOS cannot be built locally in WSL or on Linux (no macOS, no Xcode): this workflow and the
# Mobile (iOS) job of the PR build are the build. Same runner label as that job: the current .NET
# for iOS workload needs Xcode 27 (see pr-build.yml for the why). The IPA itself comes from the
# shared .github/actions/ios-ipa, which the beta and stable releases use too.

on:
  workflow_dispatch:
  # Also whenever this file changes, on any branch: a dispatch-only workflow can't be run until it
  # is on the default branch, so this is how a change to it proves itself on the PR that makes it.
  push:
    paths:
      - .github/workflows/test-ipa.yml
      - .github/actions/ios-ipa/**
      - .github/scripts/apple-version.sh

permissions:
  contents: read

jobs:
  test-ipa:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep -oE 'v[0-9]+(\.[0-9]+){1,3}' Apps2Samsung.Desktop/Helpers/AppSettings.cs)
          if [ -z "$VERSION" ]; then
            echo "❌ Version not found"
            exit 1
          fi
          BRANCH=$(echo "${{ github.ref_name }}" | tr -c 'A-Za-z0-9.\n-' '-')
          echo "VERSION_NAME=${VERSION#v}-${BRANCH}.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      # Same build as the beta and stable releases (.github/actions/ios-ipa). It also sets up
      # dotnet, the workloads and the Xcode the simulator step below builds with.
      # The branch and run go in the file name only: the app shows the three-part version iOS
      # accepts. The run number is unique per workflow, which is enough for a test build that no
      # store sees.
      - name: Build IPA
        uses: ./.github/actions/ios-ipa
        with:
          version: ${{ env.VERSION }}
          build-number: ${{ github.run_number }}
          output: dist/Apps2Samsung-${{ env.VERSION_NAME }}-ios.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Apps2Samsung-${{ env.VERSION_NAME }}-ios
          path: dist/*.ipa
          retention-days: 14
          if-no-files-found: error

      # The same app for the iOS Simulator, as the zipped .app bundle a cloud simulator takes
      # (LambdaTest / TestMu AI, Appetize): a device IPA can't run there. One zip per host
      # architecture (Apple Silicon, Intel), built one at a time: -p:RuntimeIdentifiers=a;b is a
      # global property, so it reaches the referenced Core library too, which rejects it
      # (NETSDK1083), while a single RID is fine everywhere. No AOT, so each is quick next to
      # the device publish above.
      - name: Build simulator apps
        shell: bash
        run: |
          mkdir -p dist-sim
          for RID in iossimulator-arm64 iossimulator-x64; do
            dotnet build Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj \
              -c Release -f net10.0-ios \
              -p:RuntimeIdentifier=$RID \
              -p:EnableCodeSigning=false \
              -p:ApplicationDisplayVersion="$(.github/scripts/apple-version.sh "$VERSION")" \
              -p:ApplicationVersion="${{ github.run_number }}" \
              -o "publish/$RID"

            APP=$(find "publish/$RID" -maxdepth 2 -type d -name '*.app' | head -n1)
            if [ -z "$APP" ]; then
              echo "❌ No simulator .app produced for $RID"
              find "publish/$RID" -maxdepth 2 | head -50
              exit 1
            fi
            lipo -info "$APP/Apps2Samsung.Mobile" || true
            # ditto keeps the bundle's resource forks and symlinks the way Xcode's export does.
            ditto -c -k --keepParent "$APP" "dist-sim/Apps2Samsung-${VERSION_NAME}-ios-simulator-${RID#iossimulator-}.zip"
          done
          ls -la dist-sim

      - uses: actions/upload-artifact@v7
        with:
          name: Apps2Samsung-${{ env.VERSION_NAME }}-ios-simulator
          path: dist-sim/*.zip
          retention-days: 14
          if-no-files-found: error

      # Does the simulator app actually start? Boots Apple's own simulator on this runner, on the
      # newest and the oldest iOS runtime the image has, installs the app for the runner's
      # architecture, launches it and checks after 30 s that it is still running. Each run leaves a
      # screenshot, the app's stdout/stderr (a .NET unhandled exception lands there), its unified
      # log and any crash report in the smoke-test artifact, so a cloud simulator that only says
      # "unexpected error" can be told apart from an app that crashes on start.
      - name: Start the app in the iOS Simulator
        id: smoke
        shell: bash
        run: |
          # No -e: a failing simctl call is what this step is here to record, not a reason to stop.
          set +e -uo pipefail
          BUNDLE_ID=nl.madebypatrick.apps2samsung
          RID=iossimulator-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          APP=$(find "publish/$RID" -maxdepth 2 -type d -name '*.app' | head -n1)
          mkdir -p smoke
          xcrun simctl list runtimes > smoke/runtimes.txt

          # "<runtime id> <iPhone device type id> <name>" for the newest and the oldest iOS runtime.
          xcrun simctl list runtimes -j available | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          for r in {r["identifier"]: r for r in (rts[-1:] + rts[:1])}.values():
              phones = [d for d in r.get("supportedDeviceTypes", []) if d.get("productFamily") == "iPhone"]
              # The newest plain iPhone ("iPhone 17", not "Pro"/"Plus"/"SE"); any iPhone otherwise.
              plain = [d for d in phones if d["name"].replace("iPhone ", "").isdigit()]
              plain.sort(key=lambda d: int(d["name"].replace("iPhone ", "")))
              pick = (plain or phones)[-1:]
              if pick:
                  print(r["identifier"], pick[0]["identifier"], r["name"].replace(" ", "-"))
          ' > smoke/targets.txt
          cat smoke/targets.txt
          if [ ! -s smoke/targets.txt ]; then
            echo "::error::No iOS simulator runtime with an iPhone on this image"
            exit 1
          fi

          FAILED=0
          while read -r RUNTIME DEVICE_TYPE NAME; do
            OUT="smoke/$NAME"
            mkdir -p "$OUT"
            echo "::group::$NAME"
            UDID=$(xcrun simctl create "smoke-$NAME" "$DEVICE_TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl install "$UDID" "$APP"

            # The app's own log, plus what SpringBoard / FrontBoard / RunningBoard say about starting it.
            xcrun simctl spawn "$UDID" log stream --level debug \
              --predicate 'process == "Apps2Samsung.Mobile" OR eventMessage CONTAINS[c] "apps2samsung"' \
              > "$OUT/unified.log" 2>&1 &
            LOG_PID=$!

            # simctl launch can hang when the app never finishes launching, so give it 90 s
            # (macOS has no `timeout`).
            xcrun simctl launch --terminate-running-process \
              --stdout="$PWD/$OUT/stdout.txt" --stderr="$PWD/$OUT/stderr.txt" "$UDID" "$BUNDLE_ID" \
              > "$OUT/launch-output.txt" 2>&1 &
            LAUNCHER=$!
            for i in $(seq 1 90); do
              kill -0 "$LAUNCHER" 2>/dev/null || break
              /bin/sleep 1
            done
            kill "$LAUNCHER" 2>/dev/null && echo "(simctl launch still waiting after 90 s, stopped)" >> "$OUT/launch-output.txt"
            wait "$LAUNCHER"
            LAUNCH_RC=$?
            LAUNCH=$(cat "$OUT/launch-output.txt")
            echo "simctl launch exit $LAUNCH_RC: $LAUNCH" | tee "$OUT/launch.txt"
            APP_PID=${LAUNCH##*: }
            [[ "$APP_PID" =~ ^[0-9]+$ ]] || APP_PID=0

            for i in $(seq 1 30); do
              kill -0 "$APP_PID" 2>/dev/null || break
              /bin/sleep 1
            done

            xcrun simctl io "$UDID" screenshot "$OUT/screen.png" > /dev/null 2>&1 || true
            if [ "$APP_PID" -gt 0 ] && kill -0 "$APP_PID" 2>/dev/null; then
              echo "✅ $NAME: still running after 30 s" | tee "$OUT/result.txt"
            else
              echo "❌ $NAME: the app exited within 30 s" | tee "$OUT/result.txt"
              echo "::error::$NAME: Apps2Samsung exited within 30 s of launch (see the smoke-test artifact)"
              FAILED=1
            fi

            kill "$LOG_PID" 2>/dev/null || true
            cp ~/Library/Logs/DiagnosticReports/Apps2Samsung.Mobile* "$OUT/" 2>/dev/null || true
            # The whole system log of the last 5 minutes, for whatever the predicate above missed.
            xcrun simctl spawn "$UDID" log show --last 5m --style compact > "$OUT/system.log" 2>&1 || true
            xcrun simctl listapps "$UDID" > "$OUT/listapps.txt" 2>&1 || true
            tail -n 40 "$OUT/stderr.txt" 2>/dev/null || true
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
            echo "::endgroup::"
          done < smoke/targets.txt

          {
            echo "### iOS Simulator start test"
            cat smoke/*/result.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit $FAILED

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        with:
          name: Apps2Samsung-${{ env.VERSION_NAME }}-ios-simulator-smoke-test
          path: smoke/
          retention-days: 14
          if-no-files-found: warn
