name: PR build

# Nothing else compiles the app on a pull request: the release workflows only run on a push to
# beta (beta-prerelease.yml) or a merge to master (stable-release.yml). So a compile error,
# most easily in Apps2Samsung.Mobile, which needs the maui-android workload that isn't installed
# on a normal dev machine, only surfaced *after* the merge, where it breaks the beta release.
# Build both heads here instead, so a PR can't merge a head that doesn't compile.

# The Linux packaging job builds the .deb/.rpm/AppImage the releases ship (#589). That packaging
# used to live inline in the release workflows, where a mistake in it could only ever be found by
# cutting a release; running it here means a PR proves it still produces the packages.

# The iOS job runs on macOS: the ios workload only exists there, which is also why the csproj adds the
# net10.0-ios target on macOS only. It is a compile check against the simulator SDK (no signing). It
# uses GitHub's per-Xcode runner image (`xcode-27`) rather than macos-latest: .NET for iOS refuses an
# Xcode older than the one its SDK was built with, and macos-latest lags a major behind.

# All four jobs here (Core + desktop, Mobile (Android), Mobile (iOS), Linux packages) are required
# status checks on the "Required PR checks" ruleset, together with check-localization.yml. Every one
# of them guards something a release ships: a head that fails here would otherwise fail in the beta
# or stable release workflow, after the merge. So there is deliberately no `paths:` filter: a check
# that never runs is never reported, and a required check that is never reported blocks the PR
# forever. A docs-only PR therefore pays a few minutes of builds rather than hanging. The iOS job
# depends on GitHub's Xcode runner image; when that image lags .NET for iOS, the check goes red
# for every PR until the label is bumped, and a maintainer merges past it with the ruleset bypass.

# Core + desktop also runs .github/scripts/check-version.sh first: the four version fields agree,
# the version is a clean vX.Y.Z past the last stable tag, and the beta stamp still finds its line.
# A beta merged at a version master already shipped would move that stable's beta tag
# (beta-prerelease.yml tags with -f) and the stable release of it would then be refused.

# The bots (catalog-snapshot, download-stats, sidestore-source, fdroid-repo, update-version-table)
# push their data commits straight to beta WITHOUT a skip marker. A skip marker on beta's newest
# commit made GitHub skip every pull_request workflow for the release PR (beta -> master), so its
# required checks sat at "Expected" until someone pushed real code. Instead the `scope` job below
# looks at what the push to the PR changed: when it only touched the bots' data files and the PR
# build of the commit before it passed, the four build jobs skip. A skipped required check counts
# as passed, and the code under it is the code that was just built green, so nothing is lost.
# Anything else (a code change, a force push, a first push, no green build to lean on, an API
# hiccup) builds as before. A human commit can still carry a skip marker on purpose: GitHub
# handles that before this workflow is even looked at.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the builds below have anything new to build. Fails open: `build` is true unless
  # every check proves it is not needed, and the jobs below run on an empty answer too.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          build() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }

          [ "${GITHUB_EVENT_NAME}" = pull_request ] || build true "Not a pull_request event: building."
          [ "${ACTION}" = synchronize ] || build true "PR ${ACTION:-event}: building."
          [ -n "${BEFORE}" ] && [ -n "${AFTER}" ] || build true "No before/after commit: building."

          # Only a plain fast-forward on top of the commit that was built before.
          cmp=$(gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" \
                  --jq '"\(.status) \(.files | length)", (.files[].filename)') || build true "Compare failed: building."
          read -r status count <<< "$(head -n1 <<< "$cmp")"
          [ "$status" = ahead ] || build true "Push is ${status:-unknown} of the previous head (force push?): building."
          [ "${count:-0}" -gt 0 ] && [ "${count}" -lt 300 ] || build true "${count:-0} files changed: building."

          # Every file must be bot-owned data that no build reads.
          while IFS= read -r file; do
            case "$file" in
              docs/catalog/*|docs/sidestore/*|docs/fdroid/*|README.md) ;;
              *) build true "Code or other files changed ($file): building." ;;
            esac
          done < <(tail -n +2 <<< "$cmp")

          # And the PR build of the commit underneath must have passed, so a skip never hides a failure.
          green=$(gh api "repos/${REPO}/actions/workflows/pr-build.yml/runs?head_sha=${BEFORE}&status=success&per_page=1" \
                    --jq '.total_count') || build true "Could not read the previous run: building."
          [ "${green:-0}" -gt 0 ] || build true "No passed PR build for ${BEFORE}: building."

          build false "Only bot data changed on top of ${BEFORE}, whose PR build passed: skipping the builds."

  desktop:
    name: Core + desktop
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      # Before the builds, so a forgotten bump fails in seconds, not after the compile. Reads the
      # stable tags off origin, so the shallow checkout is enough.
      - name: Check the version
        run: bash .github/scripts/check-version.sh

      # Apps2Samsung.Core comes along as a project reference, so this covers both.
      - name: Build
        run: dotnet build Apps2Samsung.Desktop/Apps2Samsung.csproj -c Release

      # The command-line head (#836) shares Core too and ships with every release.
      - name: Build the CLI
        run: dotnet build Apps2Samsung.Cli/Apps2Samsung.Cli.csproj -c Release

      # The catalog-snapshot generator shares Core; a Core change that breaks it would otherwise
      # only show up when the next half-hourly snapshot run fails.
      - name: Build the catalog snapshot tool
        run: dotnet build tools/CatalogSnapshot/CatalogSnapshot.csproj -c Release

      # The download-stats generator shares Core's DownloadStats model, for the same reason.
      - name: Build the download stats tool
        run: dotnet build tools/DownloadStats/DownloadStats.csproj -c Release

      # Same for the plugin patch rig (run by plugin-es2015-check.yml, which only triggers on plugin paths).
      - name: Build the plugin patch rig
        run: dotnet build tools/PluginPatchRig/PluginPatchRig.csproj -c Release

      # Core's unit tests (parsers, certificate choices, manifests, rename records). Part of this
      # required job rather than a job of its own, so a failing test blocks the merge without a
      # change to the ruleset.
      - name: Test Core
        run: dotnet test Apps2Samsung.Core.Tests/Apps2Samsung.Core.Tests.csproj -c Release

      # The CLI's own tests: what it shares with the desktop through settings.json.
      - name: Test the CLI
        run: dotnet test Apps2Samsung.Cli.Tests/Apps2Samsung.Cli.Tests.csproj -c Release

  android:
    name: Mobile (Android)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Compile + XAML check only. Deliberately `build`, not `publish`: packaging an APK needs the
      # signing key and the full trimming pass (minutes), and says nothing more about whether the
      # code compiles. beta-prerelease.yml still does the real publish on merge.
      - name: Build
        run: dotnet build Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj -c Release -f net10.0-android

  ios:
    name: Mobile (iOS)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.build != 'false' }}
    # The Xcode-major image, not macos-latest: the current .NET for iOS workload (27.x) demands
    # Xcode 27.0, and macos-latest (macOS 26) tops out at Xcode 26.6, the first run of this job
    # failed on exactly that. When .NET for iOS moves to the next major, bump this label with it
    # (https://github.blog/changelog/2026-10-15-xcode-27-runner-image-generally-available/).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      # Both workloads: on macOS the csproj lists net10.0-android too, and restore evaluates every
      # TFM even though only the iOS one is built below.
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android

      # The .NET for iOS workload names the Xcode it needs in its pack folder
      # (Microsoft.iOS.Sdk.net10.0_27.1 needs Xcode 27.1), and a new workload can land before the
      # image's default Xcode moves up: on 2026-10-20 workload 27.1 met default Xcode 27.0 and every
      # iOS build failed. The image carries the newer Xcode too, so pick the one the workload asks for.
      - name: Select the Xcode the iOS workload needs
        shell: bash
        run: |
          PACK=$(ls -d "$DOTNET_ROOT"/packs/Microsoft.iOS.Sdk.net*_* | sort -V | tail -1)
          XCODE_VERSION=${PACK##*_}
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::warning::Xcode ${XCODE_VERSION} is not on this image, building with the default"
          fi
          xcodebuild -version

      # Compile + XAML check only, for the simulator. Code signing is turned off explicitly: the
      # project sets CodesignEntitlements (the keychain group SecureStorage needs), and with
      # entitlements present even a simulator build looks for a signing identity in the keychain,
      # which a hosted runner doesn't have ("No valid iOS code signing keys found"). The real
      # (signed, device) publish is a release-workflow concern once distribution is settled (#753).
      - name: Build
        run: >
          dotnet build Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj -c Release -f net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false

  linux-packages:
    name: Linux packages
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Packaging tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin dpkg-dev rpm
          rsvg-convert -w 256 -h 256 jellyfin-tizen-logo.svg -o jellyfin.png
          bash .github/scripts/appimage-tools.sh

      # BOTH architectures, like the releases do. An earlier version of this job packaged x64 only,
      # on the assumption that arm64 differed by "three metadata strings", it doesn't: the aarch64
      # rpm needs rpmbuild --target, and packaging x64 alone let that reach a release (#590).
      - name: Publish and package (x64 + arm64)
        run: |
          for ARCH in x64 arm64; do
            dotnet publish Apps2Samsung.Desktop/Apps2Samsung.csproj \
              -c Release -r linux-$ARCH -p:SelfContained=true -o publish/linux-$ARCH
            # 0.0.0 rather than something like 0.0.0-pr: rpm forbids '-' in a version (it separates
            # version from release), which is what the first run of this job discovered.
            bash .github/scripts/package-linux.sh \
              "publish/linux-$ARCH" "$ARCH" 0.0.0 v0.0.0-pr dist jellyfin.png
          done

      # A package that builds but is empty would still pass the step above, so assert the payload made
      # it in, and that each package is tagged for the architecture it claims.
      - name: Check the packages contain the app
        run: |
          set -euo pipefail
          # Listings go to files first: `… | grep -q` exits on the first match, SIGPIPEs the writer,
          # and pipefail then reports the whole pipeline as failed. Whether it trips depends on the
          # listing fitting in the pipe buffer, which is why it passed locally and failed here.
          for ARCH in x64 arm64; do
            dpkg-deb -c dist/*-linux-$ARCH.deb > "deb-$ARCH.txt"
            rpm -qlp dist/*-linux-$ARCH.rpm > "rpm-$ARCH.txt"
            grep -q '/opt/apps2samsung/Apps2Samsung$' "deb-$ARCH.txt"
            grep -qx '/opt/apps2samsung/Apps2Samsung' "rpm-$ARCH.txt"

            # Present is not the same as whole. rpm's default post-install strip once reduced the
            # x64 binary from 138 MB to 11 MB, a .NET single-file bundle with its payload cut off,
            # which installs happily and then cannot run. Compare against the published binary.
            EXPECTED=$(stat -c%s "publish/linux-$ARCH/Apps2Samsung")
            IN_DEB=$(awk '$6=="./opt/apps2samsung/Apps2Samsung"{print $3}' "deb-$ARCH.txt")
            IN_RPM=$(rpm -qp --qf '[%{FILENAMES} %{LONGFILESIZES}\n]' dist/*-linux-$ARCH.rpm \
              | awk '$1=="/opt/apps2samsung/Apps2Samsung"{print $2}')
            echo "$ARCH: published=$EXPECTED deb=$IN_DEB rpm=$IN_RPM"
            test "$IN_DEB" = "$EXPECTED"
            test "$IN_RPM" = "$EXPECTED"
          done

          # The tags, not just the contents: a cross-built package that came out x86_64 would install
          # on the wrong machines and fail on the right ones.
          test "$(dpkg-deb -f dist/*-linux-x64.deb Architecture)" = amd64
          test "$(dpkg-deb -f dist/*-linux-arm64.deb Architecture)" = arm64
          test "$(rpm -qp --qf '%{ARCH}' dist/*-linux-x64.rpm)" = x86_64
          test "$(rpm -qp --qf '%{ARCH}' dist/*-linux-arm64.rpm)" = aarch64
          file -b dist/*-linux-arm64.AppImage | grep -q 'ARM aarch64'

          # Only the x64 AppImage can be unpacked here: --appimage-extract runs the AppImage's own
          # runtime, and the arm64 one is an aarch64 binary. Its payload is the same publish output
          # the .deb and .rpm above were built from, and its runtime arch is asserted just above.
          ./dist/*-linux-x64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/Apps2Samsung
          test "$(stat -c%s squashfs-root/usr/bin/Apps2Samsung)" = "$(stat -c%s publish/linux-x64/Apps2Samsung)"
          echo "deb, rpm and AppImage carry the whole app, for both architectures"

      # The AUR package is rendered from .github/aur/PKGBUILD by the stable release and built by
      # makepkg on every Arch user's machine. Prove here that the template still renders and builds,
      # from the tarballs this job just produced: makepkg uses a source file that already sits next
      # to the PKGBUILD instead of downloading it, which is how v0.0.0 can build without a release.
      - name: AUR PKGBUILD renders and builds
        run: |
          set -euo pipefail
          mkdir -p aur/src
          cp LICENSE aur/src/apps2samsung-0.0.0-LICENSE
          cp jellyfin-tizen-logo.svg aur/src/apps2samsung-0.0.0.svg
          for ARCH in x64 arm64; do
            cp "dist/Apps2Samsung-v0.0.0-pr-linux-$ARCH.tar.gz" "aur/src/Apps2Samsung-v0.0.0-linux-$ARCH.tar.gz"
          done
          .github/scripts/aur-pkgbuild.sh 0.0.0 aur/src aur/pkg
          cp aur/src/* aur/pkg/

          # makepkg refuses to run as root, hence the builder user. The size check is the same one
          # the deb/rpm get above: a stripped .NET single-file bundle installs fine and cannot run.
          docker run --rm -v "$PWD/aur/pkg:/build" \
            -e EXPECTED="$(stat -c%s publish/linux-x64/Apps2Samsung)" \
            archlinux:base-devel bash -c '
              set -euo pipefail
              useradd -m builder && chown -R builder /build && cd /build
              su builder -c "makepkg --printsrcinfo > .SRCINFO && makepkg -f --nodeps --noconfirm"
              PKG=$(ls apps2samsung-0.0.0-1-x86_64.pkg.tar.*)
              tar -tf "$PKG" > pkg.txt
              grep -qx "opt/apps2samsung/Apps2Samsung" pkg.txt
              grep -qx "usr/bin/apps2samsung" pkg.txt
              grep -qx "usr/share/applications/apps2samsung.desktop" pkg.txt
              grep -qx "usr/share/icons/hicolor/scalable/apps/apps2samsung.svg" pkg.txt
              grep -qx "usr/share/licenses/apps2samsung/LICENSE" pkg.txt
              if grep -q "\.pdb$" pkg.txt; then echo "::error::debug symbols ended up in the package"; exit 1; fi
              IN_PKG=$(tar -xOf "$PKG" opt/apps2samsung/Apps2Samsung | wc -c)
              echo "published=$EXPECTED aur=$IN_PKG"
              test "$IN_PKG" = "$EXPECTED"
              echo "AUR package builds and carries the whole app"
            '
