name: Crowdin config

# Pushes the export pattern from crowdin.yml onto the Crowdin file, clears the project's
# per-language mapping, and deletes orphaned source files and empty directories.
#
# The file itself sits at the branch root in Crowdin (/beta/en.json; crowdin.yml has
# preserve_hierarchy off), so moving the language files inside the repo changes nothing on the
# Crowdin side - only the empty folder tree of an earlier layout is left to clean up.
#
# The export pattern must agree with crowdin.yml on the branch crowdin-sync runs from (beta). To
# run the cleanup from a branch that is ahead of beta with a different path, turn "pattern" off;
# write the pattern from beta once the path has merged there.
#
# The export path is decided twice - Crowdin's own file setting builds the archive, crowdin.yml
# only places what the CLI finds inside it - and only one of the two lives in this repo. They
# drifted silently: the server pattern was %two_letters_code%, so pt-BR/pt-PT and zh-CN/zh-TW
# collided server-side and one language of each pair was dropped from every build. Run this after
# changing the translation pattern in crowdin.yml so the two cannot part company again.
#
# "languages" adds target languages to the project (Crowdin ids, e.g. "sl" for Slovenian) so a
# translator who asked for one can start. The next sync brings the file back as %locale%.json.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes. Off = report what would change and touch nothing.'
        type: boolean
        default: false
      pattern:
        description: 'Also write the export pattern. Off while this branch has a path beta does not.'
        type: boolean
        default: true
      languages:
        description: 'Target languages to add, Crowdin ids comma separated (e.g. "sl"). Empty = none.'
        type: string
        default: ''

concurrency:
  # A build started mid-change would be half-renamed.
  group: crowdin-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - name: Apply the Crowdin-side configuration
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          APPLY: ${{ inputs.apply }}
          PATTERN: ${{ inputs.pattern }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "::error::CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN are not set."
            exit 1
          fi
          [ "$APPLY" = "true" ] && apply=--apply || apply=
          [ "$PATTERN" = "false" ] && leave=--leave-pattern || leave=
          set -o pipefail
          python3 .github/scripts/crowdin_apply_config.py $apply $leave --add-languages "$LANGUAGES" | tee -a "$GITHUB_STEP_SUMMARY"
