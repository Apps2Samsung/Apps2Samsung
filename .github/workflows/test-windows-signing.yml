name: Test Windows signing

# The Windows files of any branch, built and signed exactly as the stable release does it, as a
# downloadable artifact: no GitHub release, no tag, nothing the update check can see. For trying
# the SignPath setup, or a change to it, without shipping anything.
#
# test-signing uses SignPath's self-signed test certificate, so Windows does not trust the result:
# it proves the route, not the signature. release-signing is the real certificate and is approved
# by hand in SignPath like a release. none builds the zips without signing, which is what a
# stable release does while the WINDOWS_SIGNING variable is off. See CODE_SIGNING_POLICY.md.
#
# Needs the SIGNPATH_API_TOKEN secret, except for none.

on:
  workflow_dispatch:
    inputs:
      signing_policy:
        description: "SignPath signing policy"
        type: choice
        options:
          - test-signing
          - release-signing
          - none
        default: test-signing

# actions: read is what lets SignPath read this run and its artifact with the workflow's token.
permissions:
  contents: read
  actions: read

jobs:
  test-windows-signing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Apps2Samsung.Desktop/Helpers/AppSettings.cs -Pattern 'AppVersion\s*\{\s*get;\s*set;\s*\}\s*=\s*"(v[0-9]+(\.[0-9]+){1,3})"'
          if (-not $line) {
            Write-Host "::error::AppVersion not found in AppSettings.cs"
            exit 1
          }
          $tag = $line.Matches[0].Groups[1].Value
          "VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "VERSION_TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Build and sign
        uses: $/.github/actions/windows-build
        with:
          version: ${{ steps.version.outputs.VERSION }}
          version-tag: ${{ steps.version.outputs.VERSION_TAG }}
          signing-policy: ${{ inputs.signing_policy != 'none' && inputs.signing_policy || '' }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          # A test nobody approves should not hold a runner for hours.
          approval-timeout-seconds: 1800
          output: dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Apps2Samsung-${{ inputs.signing_policy }}-${{ github.run_number }}-windows
          path: |
            dist/*.zip
            dist/*.msi
          retention-days: 7
          if-no-files-found: error
