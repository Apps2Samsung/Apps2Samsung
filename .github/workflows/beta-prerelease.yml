name: Beta Pre-Release

on:
  push:
    branches: [beta]
    paths-ignore:
      - 'README.md'
      - 'docs/**'      # website (GitHub Pages) — deploys on its own, shouldn't trigger an app release
      - '.github/**'   # workflow / repo-meta changes shouldn't trigger an app release
      - 'fastlane/**'  # store-listing metadata (F-Droid/IzzyOnDroid) — not app code
      - 'crowdin.yml'  # translation sync config — changing it ships nothing, but the build it fired
                       # overwrote the curated release notes, which then had to be re-applied
  # Allow running the beta release manually (e.g. when a merge didn't fire the push trigger).
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Apps2Samsung
  PROJECT_DIR: Jellyfin2Samsung-CrossOS
  CONFIGURATION: Release

jobs:
# ======================================================
# RELEASE + WINDOWS + LINUX
# ======================================================
  beta-release:
    runs-on: ubuntu-latest

    outputs:
      VERSION: ${{ env.VERSION }}
      VERSION_BETA: ${{ env.VERSION_BETA }}
      VERSION_TAG: ${{ env.VERSION_TAG }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------- VERSION ----------------
      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep -oE 'v[0-9]+(\.[0-9]+){1,3}' \
            Jellyfin2Samsung-CrossOS/Helpers/AppSettings.cs)

          if [ -z "$VERSION" ]; then
            echo "❌ Version not found"
            exit 1
          fi

          # VERSION      = 2.7.9        packaging fields that want a plain number (.deb, Info.plist)
          # VERSION_BETA = 2.7.9-beta   the version the app itself reports (see the stamp step below)
          # VERSION_TAG  = v2.7.9-beta  git tag, release name and asset file names
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
          echo "VERSION_BETA=${VERSION#v}-beta" >> $GITHUB_ENV
          echo "VERSION_TAG=${VERSION}-beta" >> $GITHUB_ENV

      # ---------------- BETA MARKER (#578) ----------------
      # The branch keeps a clean version (the Stable Release workflow rejects a "-beta" one), so
      # CI adds the marker here — in the build tree only, never committed — and a beta build
      # reports itself as "v2.7.9-beta" instead of claiming to be the stable v2.7.9.
      - name: Stamp beta version
        shell: bash
        run: python3 .github/scripts/stamp-beta-version.py

      # ---------------- RELEASE NOTES ----------------
      # PR-based notes via GitHub's generate-notes API (categorised by
      # .github/release.yml) instead of a raw `git log` dump.
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag --sort=-creatordate | grep beta | grep -vx "$VERSION_TAG" | head -n 1)

          # The rolling beta tag is reused across pushes, but action-gh-release
          # won't re-point an existing tag — so it stays pinned at the commit it
          # was first created on, and generate-notes computes the PR range against
          # that stale point (notes lag behind merged PRs, see #399). Force-move the
          # tag to the current commit first so the notes reflect everything merged
          # since the previous beta tag.
          git tag -f "$VERSION_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$VERSION_TAG"

          ARGS=(-f tag_name="$VERSION_TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$LAST_TAG" ]; then
            ARGS+=(-f previous_tag_name="$LAST_TAG")
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq .body > CHANGELOG.md; then
            echo "Generated PR-based notes (since ${LAST_TAG:-the beginning})"
          else
            # Fallback: filtered commit log (no [skip ci] noise, no dupes)
            echo "## ✅ What's New & Improved" > CHANGELOG.md
            git log ${LAST_TAG:+$LAST_TAG..HEAD} --pretty=format:"- %s" \
              | grep -iv '\[skip ci\]' | awk '!seen[$0]++' >> CHANGELOG.md
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          DATE=$(date +'%Y-%m-%d')

          # Tidy GitHub's generated notes: drop the HTML comment + the redundant
          # "What's Changed" heading, and shorten each
          # "* <title> by @user in <url>/pull/N" line to "- <title> (#N)".
          sed -E \
            -e '/^<!--/d' \
            -e "/^## What's Changed[[:space:]]*$/d" \
            -e 's~^\* (.*) by @[^ ]+ in https?://github.com/[^ ]+/pull/([0-9]+)[[:space:]]*$~- \1 (#\2)~' \
            CHANGELOG.md | cat -s > CHANGELOG.clean.md
          mv CHANGELOG.clean.md CHANGELOG.md

          {
            echo "## 📦 ${VERSION_TAG} — ${DATE}"
            echo ""
            cat CHANGELOG.md
            echo ""
            echo ""
            echo "| Platform | Status | Notes |"
            echo "|----------|--------|-------|"
            echo "| 🍎 macOS (.app + dmg) | ⚠️ Beta | ARM64 + Intel |"
            echo "| 🍎 macOS (CLI) | ⚠️ Beta | Per-arch tar.gz |"
            echo "| 🐧 Linux | ⚠️ Beta | x64 + ARM64 (tar.gz / .deb) |"
            echo "| 🪟 Windows | ⚠️ Beta | CI-built |"
            echo "| 🤖 Android (.apk) | ⚠️ Beta | Sideload; phone as installer head |"
          } > RELEASE_NOTES.md

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ---------------- WINDOWS ----------------
      - name: Build Windows
        run: |
          dotnet publish Jellyfin2Samsung-CrossOS/Apps2Samsung.csproj \
            -c Release -r win-x64 -p:SelfContained=true \
            -o publish/win-x64

          mkdir -p dist
          (cd publish/win-x64 && zip -r "../../dist/${PRODUCT_NAME}-${VERSION_TAG}-win-x64.zip" .)

      # ---------------- LINUX (x64 + arm64) ----------------
      - name: Build Linux
        run: |
          for ARCH in x64 arm64; do
            dotnet publish Jellyfin2Samsung-CrossOS/Apps2Samsung.csproj \
              -c Release -r linux-$ARCH -p:SelfContained=true \
              -o publish/linux-$ARCH
          done

      # ---------------- LINUX PACKAGES (tar.gz + deb + rpm + AppImage, x64 + arm64) ----------------
      # One script for all of them, shared with the stable release and with the PR check that proves
      # it still builds — see .github/scripts/package-linux.sh (#589).
      - name: Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin dpkg-dev rpm
          rsvg-convert -w 256 -h 256 jellyfin-tizen-logo.svg -o jellyfin.png
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build Linux packages
        run: |
          for ARCH in x64 arm64; do
            bash .github/scripts/package-linux.sh \
              "publish/linux-$ARCH" "$ARCH" "$VERSION" "$VERSION_TAG" dist jellyfin.png
          done

      # ---------------- RELEASE (UPDATE SAME TAG EVERY COMMIT) ----------------
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.VERSION_TAG }}
          prerelease: true
          overwrite_files: true
          files: dist/*
          body_path: RELEASE_NOTES.md

# ======================================================
# MACOS (PER-ARCH CLI + APP + DMG)
# ======================================================
  macos-app:
    runs-on: macos-latest
    needs: beta-release

    steps:
      - uses: actions/checkout@v7

      # Fresh checkout — stamp the beta marker again (see the beta-release job).
      - name: Stamp beta version
        shell: bash
        run: python3 .github/scripts/stamp-beta-version.py

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ---------------- ICON ----------------
      # ---------------- ICON ----------------
      - name: macOS icon (SVG -> ICNS)
        run: |
          # Reliable SVG -> PNG conversion on GitHub macOS runners
          brew install librsvg

          # If the SVG is already in your repo, keep this as-is.
          # If not, uncomment the curl line below and remove the local reference.
          # curl -fsSL \
          #   https://raw.githubusercontent.com/Apps2Samsung/Samsung-Jellyfin-Installer/refs/heads/master/jellyfin-tizen-logo.svg \
          #   -o jellyfin-tizen-logo.svg

          rsvg-convert -w 1024 -h 1024 jellyfin-tizen-logo.svg -o jellyfin.png

          rm -rf icon.iconset
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s jellyfin.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) jellyfin.png --out icon.iconset/icon_${s}x${s}@2x.png
          done

          iconutil -c icns icon.iconset -o jellyfin.icns

      # ---------------- ARM64 ----------------
      - name: macOS ARM64 publish
        run: |
          dotnet publish Jellyfin2Samsung-CrossOS/Apps2Samsung.csproj \
            -c Release -r osx-arm64 -p:SelfContained=true \
            -o publish/osx-arm64

          mkdir -p dist
          tar -czf \
            dist/${PRODUCT_NAME}-${{ needs.beta-release.outputs.VERSION_TAG }}-macos-arm64.tar.gz \
            -C publish/osx-arm64 .

          APP=Apps2Samsung-arm64.app/Contents
          mkdir -p $APP/MacOS $APP/Resources
          cp -R publish/osx-arm64/* $APP/MacOS/
          chmod +x $APP/MacOS/Apps2Samsung
          cp jellyfin.icns $APP/Resources/

          cat > $APP/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Apps2Samsung</string>
            <key>CFBundleExecutable</key><string>Apps2Samsung</string>
            <key>CFBundleIdentifier</key><string>org.madebypatrick.apps2samsung</string>
            <key>CFBundleVersion</key><string>${{ needs.beta-release.outputs.VERSION }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.beta-release.outputs.VERSION }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          
            <key>NSLocalNetworkUsageDescription</key>
            <string>Apps2Samsung scans your local network to find Samsung TVs in Developer Mode.</string>
            <key>CFBundleIconFile</key><string>jellyfin.icns</string>
          </dict>
          </plist>
          EOF

          codesign --deep --force --sign - Apps2Samsung-arm64.app

          rm -rf dmg-arm64
          mkdir -p dmg-arm64
          cp -R Apps2Samsung-arm64.app dmg-arm64/Apps2Samsung.app
          ln -s /Applications dmg-arm64/Applications
          hdiutil create \
            -volname Apps2Samsung \
            -srcfolder dmg-arm64 \
            -format UDZO \
            dist/${PRODUCT_NAME}-${{ needs.beta-release.outputs.VERSION_TAG }}-macos-arm64.dmg

      # ---------------- INTEL ----------------
      - name: macOS Intel publish
        run: |
          dotnet publish Jellyfin2Samsung-CrossOS/Apps2Samsung.csproj \
            -c Release -r osx-x64 -p:SelfContained=true \
            -o publish/osx-x64

          tar -czf \
            dist/${PRODUCT_NAME}-${{ needs.beta-release.outputs.VERSION_TAG }}-macos-x64.tar.gz \
            -C publish/osx-x64 .

          APP=Apps2Samsung-x64.app/Contents
          mkdir -p $APP/MacOS $APP/Resources
          cp -R publish/osx-x64/* $APP/MacOS/
          chmod +x $APP/MacOS/Apps2Samsung
          cp jellyfin.icns $APP/Resources/

          cat > $APP/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Apps2Samsung</string>
            <key>CFBundleExecutable</key><string>Apps2Samsung</string>
            <key>CFBundleIdentifier</key><string>org.madebypatrick.apps2samsung</string>
            <key>CFBundleVersion</key><string>${{ needs.beta-release.outputs.VERSION }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.beta-release.outputs.VERSION }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          
            <key>NSLocalNetworkUsageDescription</key>
            <string>Apps2Samsung scans your local network to find Samsung TVs in Developer Mode.</string>
            <key>CFBundleIconFile</key><string>jellyfin.icns</string>
          </dict>
          </plist>
          EOF

          codesign --deep --force --sign - Apps2Samsung-x64.app

          rm -rf dmg-x64
          mkdir -p dmg-x64
          cp -R Apps2Samsung-x64.app dmg-x64/Apps2Samsung.app
          ln -s /Applications dmg-x64/Applications
          hdiutil create \
            -volname Apps2Samsung \
            -srcfolder dmg-x64 \
            -format UDZO \
            dist/${PRODUCT_NAME}-${{ needs.beta-release.outputs.VERSION_TAG }}-macos-x64.dmg

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.beta-release.outputs.VERSION_TAG }}
          name: ${{ needs.beta-release.outputs.VERSION_TAG }}
          prerelease: true
          overwrite_files: true
          files: dist/*

# ======================================================
# ANDROID (.apk — the mobile installer head)
# ======================================================
  android-apk:
    runs-on: ubuntu-latest
    # Serialize the release-asset uploads: run after macos-app so the two jobs don't
    # delete+overwrite the same release concurrently (which triggered GitHub 5xx "Server
    # Error"s). Still runs even if macos-app fails, as long as the release itself was created.
    needs: [beta-release, macos-app]
    if: ${{ always() && needs.beta-release.result == 'success' }}

    steps:
      # fetch-depth: 0 is REQUIRED — the Android versionCode below is derived from the
      # commit count, and a shallow checkout reports 1. The script fails the build if
      # this is ever dropped rather than silently shipping versionCode 10.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------- ANDROID versionCode ----------------
      # Derived from the repo's commit count, so both channels stay strictly
      # increasing and beta <-> stable can always update in place. See the header of
      # .github/scripts/android-version-code.sh for the formula and why the old
      # github.run_number could (and did) go backwards.
      #
      # Runs before the build so a bad code fails in seconds instead of after a
      # ten-minute publish.
      - name: Compute Android versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/android-version-code.sh compute beta

      # Fresh checkout — stamp the beta marker again (see the beta-release job). The APK's own
      # versionName comes from the -p:ApplicationDisplayVersion below, not from this file.
      - name: Stamp beta version
        shell: bash
        run: python3 .github/scripts/stamp-beta-version.py

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # The persistent signing key is required. The old fallback minted a throwaway
      # key, which produces an APK that installs but can never update in place —
      # Android rejects a signing-key change — so it is the same "users are stuck"
      # failure as a versionCode downgrade, just with a different dialog.
      - name: Prepare Android signing key
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. An APK signed with a throwaway key cannot update existing installs — set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$PWD/a2s.keystore"
          echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KS_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "Using signing key from repo secrets."

      - name: Build APK
        run: |
          dotnet publish Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion=${{ needs.beta-release.outputs.VERSION_BETA }} \
            -p:ApplicationVersion="$ANDROID_VERSION_CODE" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$PWD/a2s.keystore" \
            -p:AndroidSigningKeyAlias="$KS_ALIAS" \
            -p:AndroidSigningStorePass="$KS_PASS" \
            -p:AndroidSigningKeyPass="$KS_PASS" \
            -o publish/android

          mkdir -p dist
          APK=$(ls publish/android/*-Signed.apk 2>/dev/null | head -n1)
          [ -z "$APK" ] && APK=$(ls publish/android/*.apk 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then
            echo "❌ No APK produced"; exit 1
          fi
          cp "$APK" "dist/${PRODUCT_NAME}-${{ needs.beta-release.outputs.VERSION_TAG }}-android.apk"

      # The -p: property above is only a request: prove the APK really carries the
      # code we computed, so an MSBuild or .csproj change can never quietly ship a
      # different one. Also logs the signing certificate.
      - name: Verify APK versionCode and signer
        shell: bash
        env:
          # SHA-256 of the release signing certificate (CN=Apps2Samsung, O=MadeByPatrick),
          # taken from the published APKs. Android refuses an update signed by a different
          # key just as hard as a versionCode downgrade, so this must never change — if
          # this step fails, the ANDROID_KEYSTORE_* secrets were swapped, and the fix is to
          # restore the original keystore, not to update this value.
          EXPECTED_SIGNER_SHA256: bd4dee21ebeee1b0b690c612318808d27f35c46fa53ba31d256379a7fed7e107
        run: |
          .github/scripts/android-version-code.sh verify \
            "dist/${PRODUCT_NAME}-${{ needs.beta-release.outputs.VERSION_TAG }}-android.apk"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.beta-release.outputs.VERSION_TAG }}
          name: ${{ needs.beta-release.outputs.VERSION_TAG }}
          prerelease: true
          overwrite_files: true
          files: dist/*
