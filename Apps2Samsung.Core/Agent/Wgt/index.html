<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Apps2Samsung Debug</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101418; color: #dce3ea;
             font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
body { padding: 28px 40px; box-sizing: border-box; }
h1 { margin: 0 0 4px 0; font-size: 30px; color: #ecf0f1; }
#platform { color: #8e99a4; font-size: 16px; margin-bottom: 14px; }
#hint { color: #8e99a4; font-size: 15px; margin-bottom: 10px; }
#layout { display: -webkit-box; display: flex; height: calc(100% - 120px); }
#list { -webkit-box-flex: 0; flex: 0 0 46%; overflow: hidden; margin-right: 24px; }
#log { -webkit-box-flex: 1; flex: 1 1 auto; overflow: hidden; font-family: Consolas, "Courier New", monospace;
       font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
.row { padding: 6px 10px; font-size: 18px; border-radius: 6px; }
.row .id { color: #8e99a4; font-size: 14px; }
.row.sel { background: #2c3e50; color: #fff; }
.ok { color: #70ff70; } .err { color: #ff7070; } .warn { color: #ffd35a; } .dim { color: #8e99a4; }
</style>
</head>
<body>
<h1>Apps2Samsung Debug <span id="version" class="dim"></span></h1>
<div id="platform">starting…</div>
<div id="hint">Driven from Apps2Samsung on your PC or phone. By hand: UP/DOWN pick · ENTER launch · RIGHT launch via app control · LEFT probe app controls · BLUE list install leftovers · RETURN exit.</div>
<div id="layout">
  <div id="list"></div>
  <div id="log"></div>
</div>
<script>
(function () {
"use strict";

/* ------------------------------------------------------------------------------------------
   The agent API. Everything Apps2Samsung does on this TV goes through window.A2S, evaluated
   over the web inspector (Runtime.evaluate, returnByValue). Rules for every function here:
     - ES5 plus Promise, no fetch, no modules: the oldest engine this app meets is Tizen 3.0's
       Chrome 47-era WebKit (required_version in config.xml), which has Promise and little else.
     - Results are plain JSON-serialisable values, never DOM nodes or Tizen objects.
     - Nothing throws to the caller: an error becomes {error:{name,message,code}}.
     - Every call is mirrored to console.log as JSON, so the DevTools console shows the same.
   launch()/launchControl() resolve on the platform's success/error CALLBACK, not on return,
   because the return value of tizen.application.launch says nothing about the outcome.
   apps()/running() are Promises for a plainer reason: tizen.application.getAppsInfo() and
   getAppsContext() only exist in callback form. Called bare they throw TypeMismatchError
   ("Cannot convert undefined to function"), which agent 0.2.0 did on every set and the toolbox
   then read as "0 apps installed".
   ------------------------------------------------------------------------------------------ */

var VERSION = "0.5.0";

/* Operations an app may register an app control for. A bare launch() that the platform refuses can
   still go through as an app control aimed at an operation the target actually handles, so these are
   probed with findAppControl() to learn what a target answers to. The tizen.org ones are the platform
   set; the samsung.com ones are guesses at what a CoBA/hotel app might register, and cost nothing when
   wrong: an unknown operation simply matches no app. */
var OPERATIONS = [
    "http://tizen.org/appcontrol/operation/main",
    "http://tizen.org/appcontrol/operation/default",
    "http://tizen.org/appcontrol/operation/view",
    "http://tizen.org/appcontrol/operation/pick",
    "http://tizen.org/appcontrol/operation/create",
    "http://tizen.org/appcontrol/operation/edit",
    "http://tizen.org/appcontrol/operation/compose",
    "http://tizen.org/appcontrol/operation/share",
    "http://tizen.org/appcontrol/operation/multi_share",
    "http://tizen.org/appcontrol/operation/share_text",
    "http://tizen.org/appcontrol/operation/search",
    "http://tizen.org/appcontrol/operation/download",
    "http://tizen.org/appcontrol/operation/setting",
    "http://tizen.org/appcontrol/operation/configure",
    "http://tizen.org/appcontrol/operation/menu",
    "http://tizen.org/appcontrol/operation/hotel",
    "http://samsung.com/appcontrol/operation/eden_resume",
    "http://samsung.com/appcontrol/operation/setting",
    "http://samsung.com/appcontrol/operation/menu",
    "http://samsung.com/appcontrol/operation/hotel",
    "http://samsung.com/appcontrol/operation/hotel_menu",
    "http://samsung.com/appcontrol/operation/hotel_option",
    "http://samsung.com/appcontrol/operation/factory",
    "http://samsung.com/appcontrol/operation/coba",
    "http://samsung.com/appcontrol/operation/coba_setting"
];

function err(e) {
    return { error: { name: e && e.name || "Error", message: e && e.message || String(e), code: e && e.code } };
}

function appInfo(a) {
    if (!a) return null;
    var cats = [];
    try { for (var i = 0; i < (a.categories || []).length; i++) cats.push(String(a.categories[i])); } catch (x) {}
    return { id: a.id, name: a.name, packageId: a.packageId, version: a.version, show: !!a.show,
             iconPath: a.iconPath || "", categories: cats };
}

function log(what, value, cls) {
    var text;
    try { text = typeof value === "string" ? value : JSON.stringify(value); } catch (x) { text = String(value); }
    try { console.log("[A2S] " + what + " " + text); } catch (x) {}
    var el = document.getElementById("log");
    var div = document.createElement("div");
    div.className = cls || "";
    div.textContent = what + " " + text;
    el.appendChild(div);
    while (el.childNodes.length > 60) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
}


/* A launch outcome arrives in a callback, so the caller gets a Promise that settles there
   (Runtime.evaluate with awaitPromise waits for it). */
function deferred(run) {
    return new Promise(function (resolve) { run(resolve); });
}

function launchResult(ok, e) {
    return ok ? { ok: true } : { ok: false, name: e && e.name || "Error", message: e && e.message || String(e), code: e && e.code };
}


/* ------------------------------------------------------------------------------------------
   The install staging folder. sdbd pushes every package to /home/owner/share/tmp/sdk_tools before
   installing it and never removes it, and its own "0 rmfile" verb is accepted but deletes nothing
   on retail firmware. This app runs as the user that owns that folder, so with the filesystem
   privileges in config.xml it can list and clear the folder itself. A clear deletes only package
   files (.wgt/.tpk/.rpm), the same set sdbd's rmfile names. Anything else in there (a .zip or an
   .xml some other tool left, #681) goes only when the user picks that one file. Nothing outside
   these two folders is ever touched.
   ------------------------------------------------------------------------------------------ */
var STAGING_DIRS = ["/home/owner/share/tmp/sdk_tools", "/home/owner/share/tmp/sdk_tools/tmp"];
var PACKAGE_EXTS = [".wgt", ".tpk", ".rpm"];

function isPackage(name) {
    var n = String(name || "").toLowerCase();
    for (var i = 0; i < PACKAGE_EXTS.length; i++) {
        var ext = PACKAGE_EXTS[i];
        if (n.length > ext.length && n.substr(n.length - ext.length) === ext) return true;
    }
    return false;
}

/* One folder's files: {path, files:[{name, path, size, modified, isPackage}]} or {path, error}. The
   platform's own answer (NotFoundError for a folder that isn't there, SecurityError for one this
   app may not see) is passed through as-is. */
function listStagingDir(path) {
    return new Promise(function (resolve) {
        var fail = function (e) { resolve({ path: path, error: err(e).error }); };
        try {
            tizen.filesystem.resolve(path, function (dir) {
                try {
                    dir.listFiles(function (entries) {
                        var files = [];
                        for (var i = 0; i < entries.length; i++) {
                            var f = entries[i];
                            if (f.isDirectory) continue;
                            var modified = null;
                            try { modified = f.modified ? f.modified.toISOString() : null; } catch (x) {}
                            files.push({ name: f.name, path: f.fullPath, size: f.fileSize || 0, modified: modified, isPackage: isPackage(f.name) });
                        }
                        resolve({ path: path, files: files });
                    }, fail);
                } catch (e) { fail(e); }
            }, fail, "r");
        } catch (e) { fail(e); }
    });
}

/* Deletes one file: {path, deleted:true} or {path, error}. Tizen 5.0 takes the path directly;
   older engines delete through the resolved parent folder. */
function deleteStagedFile(path) {
    return new Promise(function (resolve) {
        var done = function (e) { resolve(e ? { path: path, error: err(e).error } : { path: path, deleted: true }); };
        try {
            if (typeof tizen.filesystem.deleteFile === "function") {
                tizen.filesystem.deleteFile(path, function () { done(null); }, done);
                return;
            }
            var slash = path.lastIndexOf("/");
            tizen.filesystem.resolve(path.substr(0, slash), function (dir) {
                try { dir.deleteFile(path, function () { done(null); }, done); } catch (e) { done(e); }
            }, done, "rw");
        } catch (e) { done(e); }
    });
}

/* Whether `path` names a file directly inside one of STAGING_DIRS: no subfolder, no "..". The one
   gate a single-file delete goes through, since its path comes from the caller. */
function isStagedPath(path) {
    path = String(path || "");
    for (var i = 0; i < STAGING_DIRS.length; i++) {
        var prefix = STAGING_DIRS[i] + "/";
        if (path.indexOf(prefix) !== 0) continue;
        var name = path.substr(prefix.length);
        if (name.length > 0 && name.indexOf("/") < 0 && name !== "." && name !== "..") return true;
    }
    return false;
}

window.A2S = {
    version: VERSION,

    platform: function () {
        var out = { agent: VERSION, tizen: null, model: null, firmware: null,
                    userAgent: navigator.userAgent, screen: [window.innerWidth, window.innerHeight] };
        try { out.tizen = tizen.systeminfo.getCapability("http://tizen.org/feature/platform.version"); } catch (e) {}
        try { out.model = webapis.productinfo.getRealModel(); } catch (e) {}
        try { if (!out.model) out.model = webapis.productinfo.getModel(); } catch (e) {}
        try { out.firmware = webapis.productinfo.getFirmware(); } catch (e) {}
        log("platform", out, "dim");
        return out;
    },

    /* Every installed app as [{id, name, packageId, version, show, iconPath, categories}], or {error}. */
    apps: function () {
        return deferred(function (done) {
            try {
                tizen.application.getAppsInfo(
                    function (list) {
                        var out = [];
                        for (var i = 0; i < list.length; i++) out.push(appInfo(list[i]));
                        log("apps", out.length + " installed", "dim");
                        done(out);
                    },
                    function (e) { var r = err(e); log("apps", r, "err"); done(r); });
            } catch (e) { var r = err(e); log("apps", r, "err"); done(r); }
        });
    },

    app: function (id) {
        try { var a = appInfo(tizen.application.getAppInfo(id)); log("app " + id, a, "dim"); return a; }
        catch (e) { var r = err(e); log("app " + id, r, "warn"); return r; }
    },

    launch: function (id) {
        return deferred(function (done) {
            try {
                tizen.application.launch(id,
                    function () { var r = launchResult(true); log("launch " + id, r, "ok"); done(r); },
                    function (e) { var r = launchResult(false, e); log("launch " + id, r, "err"); done(r); });
            } catch (e) { var r = launchResult(false, e); log("launch " + id, r, "err"); done(r); }
        });
    },

    launchControl: function (id, operation, uri, mime) {
        operation = operation || "http://tizen.org/appcontrol/operation/main";
        return deferred(function (done) {
            try {
                var control = new tizen.ApplicationControl(operation, uri || null, mime || null, null, []);
                tizen.application.launchAppControl(control, id,
                    function () { var r = launchResult(true); r.operation = operation; log("launchControl " + id, r, "ok"); done(r); },
                    function (e) { var r = launchResult(false, e); r.operation = operation; log("launchControl " + id, r, "err"); done(r); },
                    { onsuccess: function (data) { log("launchControl reply " + id, data || null, "dim"); },
                      onfailure: function () { log("launchControl reply " + id, "failure", "warn"); } });
            } catch (e) { var r = launchResult(false, e); r.operation = operation; log("launchControl " + id, r, "err"); done(r); }
        });
    },

    /* The app ids registered for one operation: [{id, name}], or {error}. */
    handlers: function (operation) {
        return new Promise(function (resolve) {
            try {
                tizen.application.findAppControl(new tizen.ApplicationControl(operation, null, null, null, []),
                    function (infos) {
                        var out = [];
                        for (var i = 0; i < infos.length; i++) out.push({ id: infos[i].id, name: infos[i].name });
                        log("handlers " + operation, out, "dim");
                        resolve(out);
                    },
                    function (e) { var r = err(e); log("handlers " + operation, r, "warn"); resolve(r); });
            } catch (e) { var r = err(e); log("handlers " + operation, r, "warn"); resolve(r); }
        });
    },

    /* Which of OPERATIONS (or the given list) `id` registers for: {appId, operations:[...], probed: n}.
       Sequential on purpose: findAppControl is an IPC round trip each, and a burst of twenty-five
       has been seen to make the platform drop some. */
    appControls: function (id, operations) {
        operations = operations || OPERATIONS;
        return new Promise(function (resolve) {
            var out = { appId: id, operations: [], probed: operations.length };
            var i = 0;
            function next() {
                if (i >= operations.length) {
                    log("appControls " + id, out, out.operations.length ? "ok" : "warn");
                    resolve(out);
                    return;
                }
                var op = operations[i++];
                try {
                    tizen.application.findAppControl(new tizen.ApplicationControl(op, null, null, null, []),
                        function (infos) {
                            for (var k = 0; k < infos.length; k++) {
                                if (infos[k].id === id) { out.operations.push(op); break; }
                            }
                            next();
                        },
                        function () { next(); });
                } catch (e) { next(); }
            }
            next();
        });
    },

    /* The live app contexts as [{appId, id}], or {error}. */
    running: function () {
        return deferred(function (done) {
            try {
                tizen.application.getAppsContext(
                    function (list) {
                        var out = [];
                        for (var i = 0; i < list.length; i++) out.push({ appId: list[i].appId, id: list[i].id });
                        log("running", out, "dim");
                        done(out);
                    },
                    function (e) { var r = err(e); log("running", r, "err"); done(r); });
            } catch (e) { var r = err(e); log("running", r, "err"); done(r); }
        });
    },

    /* What sits in the install staging folder, both levels, sorted by path:
       {dirs:[...], files:[{name, path, size, modified, isPackage}], errors:[{path, name, message}]}.
       A missing tmp/ subfolder is not an error; anything else the platform refuses is listed in
       errors with its own words. Never throws. */
    staging: function () {
        var i = 0, out = { dirs: STAGING_DIRS.slice(), files: [], errors: [] };
        return new Promise(function (resolve) {
            function next() {
                if (i >= STAGING_DIRS.length) {
                    out.files.sort(function (a, b) { return a.path < b.path ? -1 : a.path > b.path ? 1 : 0; });
                    log("staging", out.files.length + " files" + (out.errors.length ? ", " + out.errors.length + " folder(s) unreadable" : ""),
                        out.errors.length && !out.files.length ? "warn" : "dim");
                    resolve(out);
                    return;
                }
                var path = STAGING_DIRS[i++];
                listStagingDir(path).then(function (r) {
                    if (r.error) {
                        if (!(r.error.name === "NotFoundError" && path !== STAGING_DIRS[0]))
                            out.errors.push({ path: r.path, name: r.error.name, message: r.error.message });
                    } else {
                        for (var k = 0; k < r.files.length; k++) out.files.push(r.files[k]);
                    }
                    next();
                });
            }
            next();
        });
    },

    /* Deletes the package files the staging folder holds, one at a time, and nothing else:
       {deleted:[{name, path, size}], failed:[{name, path, error:{name, message, code}}], freed: bytes,
       errors: the listing's}. Never throws. */
    clearStaging: function () {
        return window.A2S.staging().then(function (listing) {
            var targets = [];
            for (var i = 0; i < listing.files.length; i++) if (listing.files[i].isPackage) targets.push(listing.files[i]);
            var out = { deleted: [], failed: [], freed: 0, errors: listing.errors };
            var n = 0;
            return new Promise(function (resolve) {
                function next() {
                    if (n >= targets.length) {
                        log("clearStaging", out.deleted.length + " deleted, " + out.failed.length + " failed, " + out.freed + " bytes freed",
                            out.failed.length ? "warn" : "ok");
                        resolve(out);
                        return;
                    }
                    var f = targets[n++];
                    deleteStagedFile(f.path).then(function (r) {
                        if (r.deleted) { out.deleted.push({ name: f.name, path: f.path, size: f.size }); out.freed += (f.size || 0); }
                        else out.failed.push({ name: f.name, path: f.path, error: r.error });
                        next();
                    });
                }
                next();
            });
        });
    },

    /* Deletes one file from the staging folder, package or not: {path, deleted:true} or {path, error}.
       A path outside the staging folders is refused before the platform sees it. Never throws. */
    deleteStaged: function (path) {
        if (!isStagedPath(path)) {
            var refused = { path: path, error: { name: "InvalidValuesError", message: "not a file in the staging folder" } };
            log("deleteStaged", refused, "err");
            return Promise.resolve(refused);
        }
        return deleteStagedFile(path).then(function (r) {
            log("deleteStaged " + path, r.deleted ? "deleted" : r, r.deleted ? "ok" : "err");
            return r;
        });
    },

    self: function () {
        try { return appInfo(tizen.application.getCurrentApplication().appInfo); } catch (e) { return err(e); }
    }
};


/* ------------------------------------------------------------------------------------------
   On-screen fallback, for running the agent by hand: the ids the toolbox lists, UP/DOWN to pick,
   ENTER to launch, RIGHT to launch via app control. Same list as Core's SamsungSystemApps.
   ------------------------------------------------------------------------------------------ */
var candidates = [
    ["Hotel Option menu", "com.samsung.ep.coba.hotel"],
    ["Hotel quick settings", "com.samsung.ep.hotel-quicksetting-editor"],
    ["Hotel cloning", "org.tizen.ephotel-cloning"],
    ["Cloning", "org.tizen.cloning"],
    ["Samsung Apps store", "com.samsung.tv.store"],
    ["Apps", "org.volt.apps"],
    ["Settings", "com.samsung.tv.coba.setting"],
    ["Easy setup", "org.tizen.MenuEasySetup"],
    ["Software update", "org.tizen.tv.swu-standalone"],
    ["Factory menu", "org.tizen.factory"],
    ["Hotel factory menu", "org.tizen.ep-hotel-factory"],
    ["Hotel security", "org.tizen.ep-hotel-security"],
    ["Smart Hub reset", "org.tizen.smarthub-reset"],
    ["Initial setup wizard", "com.samsung.tv.wizard"]
];
var selected = 0;

function renderList() {
    var el = document.getElementById("list");
    el.innerHTML = "";
    for (var i = 0; i < candidates.length; i++) {
        var div = document.createElement("div");
        div.className = "row" + (i === selected ? " sel" : "");
        div.innerHTML = candidates[i][0] + "<br><span class='id'>" + candidates[i][1] + "</span>";
        el.appendChild(div);
    }
}

function settle(promise) {
    // The callback writes the log line; a look at the contexts afterwards shows whether the app came up.
    promise.then(function () { setTimeout(function () { window.A2S.running(); }, 1500); });
}

document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (k === 38) { selected = (selected + candidates.length - 1) % candidates.length; renderList(); }
    else if (k === 40) { selected = (selected + 1) % candidates.length; renderList(); }
    else if (k === 13) { settle(window.A2S.launch(candidates[selected][1])); }
    else if (k === 39) { settle(window.A2S.launchControl(candidates[selected][1])); }
    else if (k === 37) { window.A2S.appControls(candidates[selected][1]); }
    else if (k === 406) { window.A2S.staging(); }
    else if (k === 10009 || k === 461) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} }
    else { return; }
    e.preventDefault();
}, false);

document.getElementById("version").textContent = "v" + VERSION;
renderList();
try {
    var p = window.A2S.platform();
    document.getElementById("platform").textContent =
        (p.model || "unknown model") + " · Tizen " + (p.tizen || "?") + (p.firmware ? " · " + p.firmware : "");
    window.A2S.apps().then(function (apps) {
        if (apps && apps.length !== undefined) {
            var hidden = 0;
            for (var i = 0; i < apps.length; i++) if (!apps[i].show) hidden++;
            log("ready", apps.length + " apps installed, " + hidden + " marked hidden. Waiting for Apps2Samsung.", "ok");
        }
    });
} catch (e) { log("startup", err(e), "err"); }
})();
</script>
</body>
</html>
